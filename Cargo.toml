[package]
name = "cadforge"
version = "0.1.0"
edition = "2021"
description = "CAD-shaped web studio for training small models that generate parametric CAD"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2


# What ships is one binary that opens a browser, so make that binary worth
# downloading. Tests run under the dev profile, which is left alone.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
